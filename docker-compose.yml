version: '3.8'

services:
  app:
    build: .
    container_name: smartos_app
    command: ["npx", "tsx", "server.ts", "--host"]
    ports:
      - "80:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ADMIN_SECRET=admin123
      - ADMIN_EMAIL=master@admin.com
      - APP_URL=http://vcgreen.com.br/tmo
    restart: unless-stopped
