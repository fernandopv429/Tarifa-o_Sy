version: '3.8'

services:
  app:
    build: .
    container_name: smartos_app
    command: ["npx", "tsx", "server.ts", "--host"]
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ADMIN_SECRET=${ADMIN_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - APP_URL=${APP_URL}
    restart: unless-stopped
